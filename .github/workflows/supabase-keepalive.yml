# Keeps the Free-plan Supabase project from auto-pausing.
# Supabase pauses Free projects after ~7 days without database activity,
# so this runs a tiny read query twice a week (Mon + Thu).
#
# Uses the app's publishable key — it's already public (it ships inside
# the APK) and can only do what RLS allows: read questions.
#
# Note: GitHub disables scheduled workflows in public repos after 60 days
# with no repo activity (it emails a warning first). Any commit resets that.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 14 * * 1,4'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/supabase-keepalive.yml

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query one question
        env:
          SUPABASE_URL: https://qarrsjolwnhmoqtcikmc.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_9YrgiTYL2ay2Jbp6Z0tDLw_BbpL2r1N
        run: |
          status=$(curl -s -o response.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/questions?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "HTTP $status"
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not respond with 200 — the project may be paused. Resume it at https://supabase.com/dashboard/project/qarrsjolwnhmoqtcikmc"
            exit 1
          fi
